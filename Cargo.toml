[package]
name = "oasorabattery"
version = "0.1.0"
edition = "2024"
description = "OpenDeck/Stream Deck plugin displaying Ninjutso Sora V2 mouse battery level"
license = "MIT"
authors = ["Garrett Faucher <garrettfaucher@gmail.com>"]
repository = "https://github.com/garrettfaucher/streamdeck-sorabattery"
homepage = "https://github.com/garrettfaucher/streamdeck-sorabattery"
readme = "README.md"
keywords = ["streamdeck", "opendeck", "openaction", "plugin"]
categories = ["hardware-support"]

[dependencies]
openaction  = "2.6"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
hidapi      = "2"
image       = { version = "0.25", default-features = false, features = ["png"] }
imageproc   = "0.26"
ab_glyph    = "0.2"
async-trait = "0.1"
serde       = { version = "1.0", features = ["derive"] }
base64      = "0.22"
log         = "0.4"
simplelog   = "0.12"
anyhow      = "1"
parking_lot = "0.12.5"
