[package]
name = "oasorabattery"
version = "0.1.0"
edition = "2024"

[dependencies]
openaction  = "2.6"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
hidapi      = "2"
image       = { version = "0.25", default-features = false, features = ["png"] }
imageproc   = "0.26"
ab_glyph    = "0.2"
async-trait = "0.1"
serde       = { version = "1.0", features = ["derive"] }
base64      = "0.22"
log         = "0.4"
simplelog   = "0.12"
anyhow      = "1"
